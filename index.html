<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Misión: Descifra el Código</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <div class="luna"></div>
    <div class="tarjeta" id="tarjeta">

    <p id="pista">Astronauta , escribe tu primer número.</p>
    <input type="number" id="inputNumero" placeholder="Ingresa un número" min="1" max="100">
    <button id="btnVerificar">Transmitir</button>
    <p id="mensaje"></p>
    <h3> Señales enviadas: <span id="contador">0</span></h3>
    <ul id="historial"></ul>
    <button id="btnReiniciar">Nueva misión</button>
  </div>
